<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f4efe6" />
<title>Flary Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <button id="sound-btn" class="icon-btn" aria-label="Bật/tắt âm thanh"></button>

    <!-- START SCREEN -->
    <div id="start-screen" class="overlay">
      <div class="menu">
        <h1>flary</h1>
        <div id="color-picker" class="swatches" role="radiogroup" aria-label="Màu chim"></div>
        <button id="start-btn" class="btn primary">Chơi</button>
        <p class="hint">Space · Click · Chạm</p>
      </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="card">
        <p class="card-label">Điểm</p>
        <p id="final-score" class="card-score">0</p>
        <p id="new-best" class="badge hidden">Kỷ lục mới</p>
        <p class="card-best">Kỷ lục <span id="best-score">0</span></p>
        <div class="card-actions">
          <button id="retry-btn" class="btn primary">Chơi lại</button>
          <button id="menu-btn" class="btn ghost">Menu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
